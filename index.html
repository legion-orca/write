<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>발췌기</title>
<style>
:root{--bg:#f4f8fb;--panel:#fff;--ink:#0d2a4a;--navy:#123a6b;--blue:#2f6fd6;--sky:#8fc3ea;--mint:#3cc8b0;--mints:#e3f7f2;--mut:#6b84a0;--line:#d5e2ee;--line2:#b7cbe0;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;display:grid;place-items:center;padding:16px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
.card{position:relative;width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line2);border-top:2px solid var(--navy);padding:30px 26px 24px;text-align:center}
.card::after{content:"";position:absolute;right:-1px;top:-2px;width:64px;height:2px;background:var(--mint)}
.cs{display:flex;align-items:center;justify-content:center;gap:8px;font:500 10.5px var(--mono);letter-spacing:.24em;color:var(--blue)}
.cs i{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px var(--mints)}
h1{margin:10px 0 2px;font-size:24px;letter-spacing:-.02em;color:var(--navy)}
.sub{margin:0 0 22px;font:11px var(--mono);letter-spacing:.18em;color:var(--mut)}
.pins{display:flex;justify-content:center;gap:10px;margin-bottom:14px}
.pins span{width:46px;height:54px;border:1px solid var(--line2);background:#fbfdff;display:grid;place-items:center;font:600 22px var(--mono);color:var(--navy);transition:.15s}
.pins span.on{border-color:var(--blue);box-shadow:0 0 0 3px #e6eefb}
.pins span.f{border-color:var(--navy)}
.pins.err span{border-color:#d0573f;animation:sh .35s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#pw{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.msg{min-height:20px;font-size:12.5px;color:var(--mut)}
.msg.e{color:#d0573f}
button{margin-top:6px;width:100%;border:0;background:var(--navy);color:#fff;padding:11px;font:600 14px inherit;font-family:inherit;cursor:pointer;box-shadow:inset 0 -3px 0 var(--mint)}
button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="off">
  <div class="cs"><i></i>KNS-AQUILA · RESTRICTED</div>
  <h1>발췌기</h1>
  <p class="sub">QUOTE STUDIO · ACCESS CODE</p>
  <label class="pins" id="pins" for="pw"><span></span><span></span><span></span><span></span></label>
  <input id="pw" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autofocus aria-label="비밀번호 4자리">
  <div class="msg" id="msg">비밀번호 4자리를 입력해 주세요</div>
  <button id="go" type="submit" disabled>열기</button>
</form>

  const $ = id => document.getElementById(id), pw = $('pw'), pins = $('pins'), msg = $('msg'), go = $('go');
  const u8 = b => Uint8Array.from(atob(b), c => c.charCodeAt(0));
  const paint = () => {
    const v = pw.value; [...pins.children].forEach((s, k) => { s.textContent = k < v.length ? '•' : ''; s.classList.toggle('f', k < v.length); s.classList.toggle('on', k === v.length && document.activeElement === pw); });
    go.disabled = v.length !== 4;
  };
  pw.addEventListener('input', () => { pw.value = pw.value.replace(/\D/g, '').slice(0, 4); pins.classList.remove('err'); msg.className = 'msg'; msg.textContent = '비밀번호 4자리를 입력해 주세요'; paint(); if (pw.value.length === 4) unlock(); });
  pw.addEventListener('focus', paint); pw.addEventListener('blur', paint);
  pins.addEventListener('click', () => pw.focus());
  $('f').addEventListener('submit', e => { e.preventDefault(); unlock(); });
  let busy = false;
  async function unlock(){
    if (busy || pw.value.length !== 4) return;
    if (!(window.crypto && crypto.subtle)) { msg.className = 'msg e'; msg.textContent = '이 브라우저에선 열 수 없어요 (https 주소에서 열어 주세요)'; return; }
    busy = true; go.disabled = true; msg.className = 'msg'; msg.textContent = '확인하는 중…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: u8(D.s), iterations: D.n, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
      const html = new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: u8(D.i)}, key, u8(D.c)));
      document.open(); document.write(html); document.close();
    } catch (err) {
      busy = false; pw.value = ''; paint(); pins.classList.add('err');
      msg.className = 'msg e'; msg.textContent = '비밀번호가 맞지 않아요'; pw.focus();
    }
  }
  paint();
